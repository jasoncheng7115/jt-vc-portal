<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="jt-vc-portal">
  <defs>
    <linearGradient id="jtvcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="0.55" stop-color="#6d4aea"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- 圓角漸層底（Pages 品牌色：青 → 紫） -->
